# Crossplane v2 Helm values (chart crossplane-stable/crossplane 2.4.3).
# Install:
#   helm repo add crossplane-stable https://charts.crossplane.io/stable && helm repo update
#   helm install crossplane crossplane-stable/crossplane --version 2.4.3 \
#     --namespace crossplane-system --create-namespace -f install/crossplane-helm-values.yaml
#
# Composition functions, composition revisions and EnvironmentConfigs are always on in Crossplane v2, so the old
# `--enable-composition-functions`, `--enable-environment-configs` and `--enable-composition-revisions` args are
# gone and Crossplane v2 does not accept them.

replicas: 1

image:
  repository: xpkg.crossplane.io/crossplane/crossplane
  # Empty = the chart's appVersion (2.4.3).
  tag: ""
  pullPolicy: IfNotPresent

nodeSelector: {}
tolerations: []

resourcesCrossplane:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

resourcesRBACManager:
  limits:
    cpu: 100m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 64Mi

# No extra flags needed.
args: []

metrics:
  enabled: true

# Single replica, but keep leader election explicit so scaling out later is a one-line change.
leaderElection: true

webhooks:
  enabled: true

provider:
  # Providers are installed from providers/ (declarative, GitOps friendly), not through Helm values.
  packages: []
  # Do not activate every managed resource CRD of every provider; providers/managed-resource-activation-policy.yaml
  # activates only the kinds this repo uses.
  defaultActivations: []

# Keep the downloaded packages (providers, functions) across Crossplane pod restarts: point this at a
# PersistentVolumeClaim. Empty = an emptyDir, which is fine for a lab and for CI.
packageCache:
  medium: ""
  sizeLimit: 5Gi
  pvc: ""
