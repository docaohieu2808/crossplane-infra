# Namespaced managed resources (provider-upjet-gcp v3, `*.gcp.m.upbound.io`) live in a namespace and use a
# ClusterProviderConfig (cluster-scoped credentials) or a namespaced ProviderConfig.
apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Network
metadata:
  name: gcp-network-vpc-example
  namespace: default
  annotations:
    crossplane.io/description: "Example GCP VPC network managed resource"
spec:
  forProvider:
    autoCreateSubnetworks: false
    routingMode: REGIONAL
    description: "VPC network managed by Crossplane"
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: compute.gcp.m.upbound.io/v1beta1
kind: Subnetwork
metadata:
  name: gcp-subnetwork-example
  namespace: default
  annotations:
    crossplane.io/description: "Example GCP subnetwork managed resource"
spec:
  forProvider:
    region: us-central1
    ipCidrRange: "10.0.0.0/24"
    networkRef:
      name: gcp-network-vpc-example
    description: "Subnetwork managed by Crossplane"
    privateIpGoogleAccess: true
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
