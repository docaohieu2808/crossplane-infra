apiVersion: storage.gcp.upbound.io/v1beta1
kind: Bucket
metadata:
  name: gcp-storage-bucket-example
  annotations:
    crossplane.io/description: "Example GCP Cloud Storage bucket managed resource"
spec:
  forProvider:
    location: US-CENTRAL1
    storageClass: STANDARD
    uniformBucketLevelAccess: true
    versioning:
      - enabled: true
    lifecycleRule:
      - action:
          - type: Delete
        condition:
          - age: 90
            withState: ANY
    labels:
      managed-by: crossplane
      environment: example
  providerConfigRef:
    name: default
