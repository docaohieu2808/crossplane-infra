apiVersion: storage.gcp.m.upbound.io/v1beta2
kind: Bucket
metadata:
  name: gcp-storage-bucket-example
  namespace: default
  annotations:
    crossplane.io/description: "Example GCP Cloud Storage bucket managed resource"
    # Bucket names are global in GCS: pick your own.
    crossplane.io/external-name: crossplane-infra-example-bucket
spec:
  forProvider:
    location: US-CENTRAL1
    storageClass: STANDARD
    uniformBucketLevelAccess: true
    publicAccessPrevention: enforced
    versioning:
      enabled: true
    lifecycleRule:
      - action:
          type: Delete
        condition:
          age: 90
          withState: ANY
    labels:
      managed-by: crossplane
      environment: example
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
