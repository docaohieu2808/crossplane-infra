# EnvironmentConfig is cluster-scoped and read by function-environment-configs, which selects it by the
# `environment` label and exposes `data` to later pipeline steps. An XR can still override any value.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: env-staging
  labels:
    environment: staging
  annotations:
    crossplane.io/description: "EnvironmentConfig for the staging environment with mid-size machine types"
data:
  environment: staging
  region: us-central1
  zone: us-central1-b
  machineType: e2-medium
  diskSizeGb: 50
  bucketLocation: US-CENTRAL1
  enableVersioning: true
  networkCidr: "10.0.2.0/24"
  deletionProtection: false
  storageClass: STANDARD
  tags:
    environment: staging
    tier: staging
    cost-center: engineering
