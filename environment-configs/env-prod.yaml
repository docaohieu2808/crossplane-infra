apiVersion: apiextensions.crossplane.io/v1alpha1
kind: EnvironmentConfig
metadata:
  name: env-prod
  labels:
    environment: prod
  annotations:
    crossplane.io/description: "EnvironmentConfig for production environment with high-availability large machine types"
data:
  environment: prod
  region: us-central1
  zone: us-central1-c
  machineType: e2-standard-4
  diskSizeGb: "100"
  bucketLocation: US
  enableVersioning: "true"
  networkCidr: "10.0.3.0/24"
  replicaCount: "3"
  storageClass: STANDARD
  maintenanceWindow: "04:00"
  deletionPolicy: Orphan
  tags:
    environment: prod
    tier: production
    cost-center: operations
    compliance: required
