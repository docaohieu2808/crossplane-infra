# Metadata for the Configuration package: `scripts/build-configuration-package.sh` copies this next to the XRD and
# the GCP Composition and runs `crossplane xpkg build`. Crossplane installs every dependency below for you.
# function-resource-labeler (custom-function/) is deliberately not listed: it has no public registry, so install it
# from your own (see functions/function-resource-labeler.yaml).
apiVersion: meta.pkg.crossplane.io/v1
kind: Configuration
metadata:
  name: crossplane-web-app-gcp
  annotations:
    crossplane.io/description: "Crossplane OCI package: WebApplication XRD + GCP Composition"
spec:
  crossplane:
    version: ">=v2.0.0-0"
  dependsOn:
    - function: xpkg.crossplane.io/crossplane-contrib/function-environment-configs
      version: ">=v0.9.2"
    - function: xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform
      version: ">=v0.11.2"
    - provider: xpkg.upbound.io/upbound/provider-gcp-storage
      version: ">=v3.1.0"
    - provider: xpkg.upbound.io/upbound/provider-gcp-compute
      version: ">=v3.1.0"
