apiVersion: infra.example.io/v1alpha1
kind: WebApplication
metadata:
  name: my-web-app-dev
  namespace: default
  annotations:
    crossplane.io/description: "Example WebApplication claim for the dev environment"
spec:
  compositeDeletePolicy: Background
  compositionRef:
    name: composition-web-app-gcp
  parameters:
    appName: my-web-app
    environment: dev
    region: us-central1
    machineType: e2-micro
    diskSizeGb: 20
    bucketLocation: US-CENTRAL1
    enableVersioning: false
    networkCidr: "10.0.1.0/24"
