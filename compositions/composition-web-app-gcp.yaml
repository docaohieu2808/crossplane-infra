# Pipeline-mode Composition (the only mode in Crossplane v2) that implements WebApplication on GCP.
#
#   1. load-environment  function-environment-configs: pick the EnvironmentConfig for spec.parameters.environment
#   2. render-resources  function-patch-and-transform: VPC, subnet, firewall, VM, bucket. Per-environment values
#                        come from the EnvironmentConfig; spec.parameters on the XR overrides them
#   3. label-resources   function-resource-labeler (custom Go function in custom-function/): stamp labels
#
# The XR is namespaced, so every composed resource is namespaced too: the `*.gcp.m.upbound.io` API groups of
# provider-upjet-gcp, and a ClusterProviderConfig (cluster-scoped, usable from any namespace).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: web-app-gcp
  labels:
    provider: gcp
    type: web-application
  annotations:
    crossplane.io/description: "GCP implementation composing VPC + firewall + VM + storage bucket for the WebApplication XRD"
spec:
  compositeTypeRef:
    apiVersion: infra.example.io/v1alpha1
    kind: WebApplication
  mode: Pipeline
  pipeline:
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Selector
              selector:
                mode: Single
                matchLabels:
                  - key: environment
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.parameters.environment

    - step: render-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # VPC network (custom-mode: subnets are created explicitly)
          - name: vpc-network
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Network
              spec:
                forProvider:
                  autoCreateSubnetworks: false
                  routingMode: REGIONAL
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.environment
                toFieldPath: metadata.labels.environment
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.vpcNetworkName

          # Subnetwork
          - name: subnetwork
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Subnetwork
              spec:
                forProvider:
                  privateIpGoogleAccess: true
                  networkSelector:
                    matchControllerRef: true
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromEnvironmentFieldPath
                fromFieldPath: region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.region
              - type: FromEnvironmentFieldPath
                fromFieldPath: networkCidr
                toFieldPath: spec.forProvider.ipCidrRange
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.networkCidr
                toFieldPath: spec.forProvider.ipCidrRange

          # Firewall: SSH only through Identity-Aware Proxy (35.235.240.0/20 is Google's IAP range), no public IP
          - name: firewall-iap-ssh
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Firewall
              spec:
                forProvider:
                  direction: INGRESS
                  sourceRanges:
                    - 35.235.240.0/20
                  targetTags:
                    - web
                  allow:
                    - protocol: tcp
                      ports:
                        - "22"
                  networkSelector:
                    matchControllerRef: true
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default

          # Compute instance: no accessConfig, so no external IP; OS Login on; narrow API scopes
          - name: compute-instance
            base:
              apiVersion: compute.gcp.m.upbound.io/v1beta1
              kind: Instance
              spec:
                forProvider:
                  bootDisk:
                    initializeParams:
                      image: debian-cloud/debian-12
                  networkInterface:
                    - networkSelector:
                        matchControllerRef: true
                      subnetworkSelector:
                        matchControllerRef: true
                  metadata:
                    enable-oslogin: "TRUE"
                  serviceAccount:
                    scopes:
                      - https://www.googleapis.com/auth/logging.write
                      - https://www.googleapis.com/auth/monitoring.write
                  tags:
                    - web
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromEnvironmentFieldPath
                fromFieldPath: zone
                toFieldPath: spec.forProvider.zone
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.region
                toFieldPath: spec.forProvider.zone
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-a"
              - type: FromEnvironmentFieldPath
                fromFieldPath: machineType
                toFieldPath: spec.forProvider.machineType
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.machineType
                toFieldPath: spec.forProvider.machineType
              - type: FromEnvironmentFieldPath
                fromFieldPath: diskSizeGb
                toFieldPath: spec.forProvider.bootDisk.initializeParams.size
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.diskSizeGb
                toFieldPath: spec.forProvider.bootDisk.initializeParams.size
              - type: FromEnvironmentFieldPath
                fromFieldPath: deletionProtection
                toFieldPath: spec.forProvider.deletionProtection
              - type: FromEnvironmentFieldPath
                fromFieldPath: tags
                toFieldPath: spec.forProvider.labels
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.computeInstanceName

          # Storage bucket: bucket names are global in GCS, so appName and environment form the name
          - name: storage-bucket
            base:
              apiVersion: storage.gcp.m.upbound.io/v1beta2
              kind: Bucket
              spec:
                forProvider:
                  uniformBucketLevelAccess: true
                  publicAccessPrevention: enforced
                  lifecycleRule:
                    - action:
                        type: Delete
                      condition:
                        age: 90
                        withState: ANY
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.parameters.appName
                    - fromFieldPath: spec.parameters.environment
                  strategy: string
                  string:
                    fmt: "%s-%s-bucket"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - type: FromEnvironmentFieldPath
                fromFieldPath: bucketLocation
                toFieldPath: spec.forProvider.location
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.bucketLocation
                toFieldPath: spec.forProvider.location
              - type: FromEnvironmentFieldPath
                fromFieldPath: storageClass
                toFieldPath: spec.forProvider.storageClass
              - type: FromEnvironmentFieldPath
                fromFieldPath: enableVersioning
                toFieldPath: spec.forProvider.versioning.enabled
              - type: FromCompositeFieldPath
                fromFieldPath: spec.parameters.enableVersioning
                toFieldPath: spec.forProvider.versioning.enabled
              - type: FromEnvironmentFieldPath
                fromFieldPath: tags
                toFieldPath: spec.forProvider.labels
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.storageBucketName

    - step: label-resources
      functionRef:
        name: function-resource-labeler
      input:
        apiVersion: resourcelabeler.fn.example.io/v1beta1
        kind: Input
        labels:
          app.kubernetes.io/managed-by: crossplane
          infra.example.io/composition: web-app-gcp
