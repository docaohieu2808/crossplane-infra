# Crossplane v2 XRD: `apiextensions.crossplane.io/v2` with `scope: Namespaced`. There is no Claim and no
# `X`-prefixed kind any more: app teams create a WebApplication directly in their own namespace.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: webapplications.infra.example.io
  annotations:
    crossplane.io/description: "XRD defining the namespaced WebApplication composite resource"
spec:
  scope: Namespaced
  group: infra.example.io
  names:
    kind: WebApplication
    plural: webapplications
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  description: >-
                    Only appName and environment are required. Everything else falls back to the
                    EnvironmentConfig selected by `environment`, and can be overridden here.
                  required:
                    - environment
                    - appName
                  properties:
                    appName:
                      type: string
                      description: "Name of the web application (lowercase letters, digits and dashes)"
                      pattern: "^[a-z][a-z0-9-]{1,28}[a-z0-9]$"
                    environment:
                      type: string
                      description: "Target environment: dev, staging, or prod"
                      enum:
                        - dev
                        - staging
                        - prod
                    region:
                      type: string
                      description: "GCP region for resource deployment (default from the EnvironmentConfig)"
                    machineType:
                      type: string
                      description: "GCP machine type for the compute instance (default from the EnvironmentConfig)"
                    diskSizeGb:
                      type: integer
                      description: "Boot disk size in GB (default from the EnvironmentConfig)"
                      minimum: 20
                      maximum: 500
                    bucketLocation:
                      type: string
                      description: "GCP storage bucket location (default from the EnvironmentConfig)"
                    enableVersioning:
                      type: boolean
                      description: "Enable object versioning on the storage bucket (default from the EnvironmentConfig)"
                    networkCidr:
                      type: string
                      description: "CIDR block for the VPC subnetwork (default from the EnvironmentConfig)"
              x-kubernetes-validations:
                - rule: "self.parameters.environment != 'prod' || !has(self.parameters.diskSizeGb) || self.parameters.diskSizeGb >= 50"
                  message: "prod boot disks must be at least 50 GB"
            status:
              type: object
              properties:
                vpcNetworkName:
                  type: string
                  description: "Name of the provisioned VPC network"
                computeInstanceName:
                  type: string
                  description: "Name of the provisioned compute instance"
                storageBucketName:
                  type: string
                  description: "Name of the provisioned storage bucket"
