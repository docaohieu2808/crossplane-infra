# Provider family: provider-upjet-gcp ships one small provider per GCP service plus a shared
# provider-family-gcp (ProviderConfig types), which the family providers pull in as a dependency.
# Install only what you use instead of the ~hundreds of CRDs of a monolith.
#
# Resources used in this repo:
#   - managed-resources/gcp-storage-bucket.yaml   -> provider-gcp-storage
#   - managed-resources/gcp-compute-instance.yaml -> provider-gcp-compute
#   - managed-resources/gcp-network-vpc.yaml      -> provider-gcp-compute (Network/Subnetwork)
#   - compositions/composition-web-app-gcp.yaml  -> both (+ Firewall)
#
# DeploymentRuntimeConfig (pkg.crossplane.io/v1beta1) tunes the provider pod; it replaced ControllerConfig.

apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-gcp-runtime-config
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"

---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-storage
  annotations:
    crossplane.io/description: "Upbound GCP Storage provider family member (Bucket, HMAC keys)"
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-storage:v3.1.0
  runtimeConfigRef:
    name: provider-gcp-runtime-config

---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp-compute
  annotations:
    crossplane.io/description: "Upbound GCP Compute provider family member (Instance, Network, Subnetwork, Firewall, Disk)"
spec:
  package: xpkg.upbound.io/upbound/provider-gcp-compute:v3.1.0
  runtimeConfigRef:
    name: provider-gcp-runtime-config
