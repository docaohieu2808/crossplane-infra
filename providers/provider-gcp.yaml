apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-gcp
  annotations:
    crossplane.io/description: "Official GCP provider for Crossplane"
spec:
  package: xpkg.upbound.io/upbound/provider-gcp:v0.41.0
  controllerConfigRef:
    name: provider-gcp-config
---
apiVersion: pkg.crossplane.io/v1alpha1
kind: ControllerConfig
metadata:
  name: provider-gcp-config
spec:
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
