# Cluster-scoped credentials for the namespaced (`*.gcp.m.upbound.io`) managed resources of provider-upjet-gcp v3.
# The key stays in a Secret (see README): no credentials in git. Use a namespaced `ProviderConfig` instead to
# give one namespace its own GCP project.
apiVersion: gcp.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  projectID: my-gcp-project
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: gcp-credentials
      key: credentials.json
