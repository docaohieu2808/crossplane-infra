# provider-nop manages nothing: a NopResource only reports the conditions you ask for. It lets the whole
# XRD -> Composition -> functions -> Ready path run on a laptop or CI runner without a cloud account.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-nop
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-nop:v0.6.0
---
# Crossplane v2 only creates the CRDs of a managed resource once a ManagedResourceActivationPolicy activates it.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: nop
spec:
  activate:
    - nopresources.nop.crossplane.io
